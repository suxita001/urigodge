    <script>
      // Runs before first paint so night mode never flashes white.
      try {
        var saved = localStorage.getItem('urigod-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        if (dark) document.querySelector('meta[name=theme-color]').setAttribute('content', '#131210')
      } catch (e) {}
    </script>
